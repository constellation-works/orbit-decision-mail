[project]
name = "orbit-decision-mail"
version = "0.1.0"
description = "Email transport plugin for Orbit's human decision channel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# The runtime is the standard library only (smtplib, imaplib, email); the
# launcher runs .orbit-plugin/src directly. Keep it that way: a runtime
# dependency would need a locked environment in plugin state.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
    "basedpyright>=1.40.1",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

# Not a package: the plugin tree is the only copy of the code.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".orbit-plugin/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".orbit-plugin/src"]
# Bound the runtime of each test while leaving the full suite unbounded.
timeout = 60
# A parametrized test with no cases is an error, not a silent skip.
empty_parameter_set_mark = "fail_at_collect"
# Print why each skipped test skipped.
addopts = "-rs"

[tool.basedpyright]
include = [".orbit-plugin/src"]
extraPaths = [".orbit-plugin/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
