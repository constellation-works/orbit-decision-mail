schemaVersion: 2
kind: Plugin
metadata:
  name: decision-mail
  version: 0.1.0
  description: >-
    Email transport for Orbit's human decision channel: mails decision requests on
    held work over SMTP, polls a dedicated mailbox over IMAP, authenticates replies
    (sender allowlist, DKIM/SPF/DMARC) and submits them through orbit.decision.submit,
    where core verifies the token and applies the answer.
  homepage: https://github.com/constellation-works/orbit-decision-mail
spec:
  requires:
    orbit: ">=0.33.0 <1.0.0"
    host_api: 1
    platforms: [linux, macos]
    # uv finds the interpreter; orbit is how the backend calls back into Orbit.
    programs: [uv, orbit]

  backend:
    type: exec
    command: bin/decision-mail
    args: [orbit-tool]
    timeout_ms: 120000
    sandbox: default

  permissions:
    fs:
      # The interpreter uv provides, its cache and bytecode, and the plugin's own
      # bookkeeping (which requests were mailed, refusal rate limits, drop and
      # refusal counters) lives in plugin state.
      write: ["{{plugin_state}}"]
    # SMTP and IMAP to the channel mailbox; also the first call's interpreter fetch.
    network: any
    # Callbacks through the plugin's callback session. decision.submit applies an answer and
    # decision.digest raises the approval requests the digest lists; core allows both only
    # for the channel bound to this plugin.
    orbit_tools:
      - orbit.decision.digest
      - orbit.decision.list
      - orbit.decision.show
      - orbit.decision.submit
      - orbit.task.show

  secrets:
    - name: smtp_password
      description: Password or app password for sending from the channel mailbox over SMTP.
      rotatable: false
    - name: imap_password
      description: Password or app password for polling the channel mailbox over IMAP.
      rotatable: false
    - name: channel_key
      description: >-
        HMAC key minted by `orbit decision channel register email`, used to render reply
        tokens. Core holds the mirror it verifies against.
      rotatable: false

  tools:
    - name: status
      description: >-
        Report the plugin version, whether the mail transport is configured (`ready`) or
        which config keys and secrets are missing (names only; never a value), and recent
        activity from plugin state: the last notify and poll, the last transport error and
        the latest dropped (unauthenticated) mails, cumulative counters and the newest 20
        events (drops, core refusals, SMTP/IMAP errors, loop-guard suppressions). An event
        keeps the sender, the reason, the request id and the time: no body, token or header.
        Contacts no server and writes nothing.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/status.request.json }
      output_schema: { $ref: schemas/status.response.json }
    - name: activity
      description: >-
        Report the drop, refusal, transport and loop-guard counters and the newest 20 events
        from plugin state. Each event keeps the sender address, the reason, the request id
        and the time, and never a body, a token, a secret or a header. The same figures are
        on `status`. Contacts no server and writes nothing.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/activity.request.json }
      output_schema: { $ref: schemas/activity.response.json }
    - name: notify
      description: >-
        Mail the open decision requests that have not been mailed yet (or only
        `request_ids`) to the operator over SMTP, with the per-request reply token, the
        numbered answers and the dashboard link, as `digest_mode` allows: `immediate` mails
        all, `daily` only block_triage (other gates wait for the digest), `off` none. Records
        what it sent in plugin state so a request is mailed once; a send failure, or a send
        inside the quiet hours, fails the call so the routine retries.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/notify.request.json }
      output_schema: { $ref: schemas/notify.response.json }
    - name: digest
      description: >-
        Send the decision digest: one mail listing proposed tasks first (title, one-line
        summary, pilot state), then open requests nearing expiry or mailed under an older key
        epoch, then the requests `daily` mode held for it, each numbered with its own token,
        followed by the answers applied from earlier digest replies. Raises what is missing
        through orbit.decision.digest, so every request it lists is timed from this send.
        Sends nothing when there is nothing to list, when `digest_mode` is `off`, and fails
        retryably inside the quiet hours. A send failure fails the call.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/digest.request.json }
      output_schema: { $ref: schemas/digest.response.json }
    - name: poll
      description: >-
        Read unseen mail in the channel mailbox over IMAP. A reply from an allowlisted
        sender whose provider stamp shows DKIM and SPF pass (and no DMARC fail) is parsed
        with the closed answer grammar and submitted to orbit.decision.submit; core
        verifies and applies it. A reply to a digest mail answers item by item (`approve
        1,3`, `reject 2`); a bare `approve` or an unknown item number refuses the whole
        reply and applies nothing. Sends a confirmation (queued for the next digest when it
        answers a digest) or a rate-limited refusal mail, and files handled mail to the
        processed folder. Forged or unknown mail is dropped
        without a reply. Never deletes mail.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/poll.request.json }
      output_schema: { $ref: schemas/poll.response.json }
    - name: parse-reply
      description: >-
        Apply the decision channel's reply grammar to a reply text against the answer ids
        a mail printed, returning the chosen answer id and note or why the reply is
        unparseable. Pure: reads no mailbox, calls no server and writes nothing.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/parse-reply.request.json }
      output_schema: { $ref: schemas/parse-reply.response.json }

  definitions:
    # The notify and poll steps and their jobs: a catalog layer, not copied.
    activities: [definitions/activities/*.yaml]
    jobs: [definitions/jobs/*.yaml]
    # Seeded disabled into the workspace's .orbit/routines as decision-mail-<name>.
    routines: [definitions/routines/*.yaml]

  config:
    schema: schemas/config.json

  web:
    panels:
      - id: status
        title: Decision mail
        source: tool:status
        render: json
        group: operations
        refresh_ms: 60000
      - id: activity
        title: Drops and refusals
        source: tool:activity
        render: json
        group: operations
        refresh_ms: 60000

  tests: [tests/conformance/*.yaml]
